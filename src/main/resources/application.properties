spring.application.name=WorkflowManager

keycloak.auth-server-url=http://localhost:8081
keycloak.realm=workflow-realm
keycloak.resource=workflow-client
keycloak.credentials.secret=your-client-secret-here

app.redirect-uri=http://localhost:8080/auth/callback

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/workflow-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/workflow-realm/protocol/openid-connect/certs

jwt.auth.converter.resource-id=workflow-client
jwt.auth.converter.principle-attribute=preferred_username

spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=http://localhost:5173
spring.graphql.cors.allowed-methods=GET,POST
spring.graphql.cors.max-age=1800s

spring.mongodb.uri=mongodb://root:password@localhost:27017/wfdb?authSource=admin

# Root level — everything not explicitly configured
logging.level.root=WARN

# Your app — show debug during development
logging.level.com.sutusxxx.WorkflowManager=DEBUG

# Spring Security — useful for diagnosing auth issues
logging.level.org.springframework.security=DEBUG

# Show SQL queries (if using JPA)
logging.level.org.hibernate.SQL=DEBUG

# Log to a file as well as console
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
